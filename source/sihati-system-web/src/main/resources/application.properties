# Application
app.name=sihati
app.domain=http://sihati.loc.elit.dz
app.cordinateur.url=https://10.6.98.79:9191/Coordinateur/api/production
app.cordinateur.user=tuqqna.tbt
app.cordinateur.password=
app.cordinateur.instance=TDB
springdoc.swagger-ui.path=/swagger-ui-custom.html

# Server
server.port=${PORT:10000}
server.address=0.0.0.0
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.prefix=access_log
server.tomcat.accesslog.file-date-format=.yyyy-MM-dd
server.tomcat.basedir=/tmp/tomcat
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.pattern="%t %a %{x-forwarded-for}i %{user}r  request:%{SESSIONID}r %m %U %s %q %r  "
server.tomcat.remote-ip-header=x-forwarded-for
server.tomcat.protocol-header=x-forwarded-proto
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
server.http2.enabled=true
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

# Static resource cache
spring.resources.cache.cachecontrol.max-age=120
spring.resources.cache.cachecontrol.must-revalidate=true
spring.resources.cache.period=3600

# Multipart file uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=75MB

file.upload-dir=./uploads
file.print-dir=./print

# Security
app.security.default-password=Elit.2017
app-security.auth_header=Authorization
app-security.expires_in_seconds=14400
app-security.max_attempt=5
app-security.bocked_in_second=60
app-security.refreshed_time_lapse_seconds=3000
app-security.secret=Amine24h
app-security.ip_domain=localhost
app-security.port_domain=4200
app-security.path_key_public=${KEY_PUBLIC_PATH:/app/key/public_key.pem}
app-security.path_key_private=${KEY_PRIVATE_PATH:/app/key/private_key.pem}

# Database Configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Flyway
spring.flyway.schemas=admin
spring.flyway.baseline-on-migrate=true

# JPA / Hibernate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.defer-datasource-initialization=true

# Startup optimization
spring.main.lazy-initialization=true

# Cache (Caffeine - replaces Redis)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=60s
app.cache.timeoutSeconds=60
app.cache.timeout=60
app.cache.cacheExpirations.top-notifications=180

# Logging
app.logger.seq.url=http://localhost:5341/
app.logger.rollingfile.pathtemplate=logs/log-{Date}.log
app.logger.level=Debug
logging.level.root=info
logging.level.org.springframework.web=warn
logging.level.org.hibernate=error
logging.level.org.apache.tomcat=warn
logging.level.org.apache.catalina=warn
spring.thymeleaf.check-template-location=false

# Actuator / Admin
spring.boot.admin.client.url=${ADMIN_URL:http://localhost:8080}
management.endpoints.web.exposure.include=*
management.endpoints.web.exposure.exclude=beans
management.endpoint.shutdown.enabled=true
management.endpoint.health.show-details=always

# Notification (internal - may not be reachable on cloud)
notification.service.url=https://192.168.1.2:8443

